name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - '**'
    types:
    - opened
    - edited
    - reopened
    - synchronize
  merge_group:
  schedule:
  - cron:  '0 19 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  id-token: write
  contents: read

env:
  IMAGE_PLATFORM: 'linux/amd64,linux/arm64'
  retention_days: 90
  CI_PROMOTE: false

jobs:
  images:
    name: Build images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Install qemu-user-static
      shell: bash
      run: |
        set -euEo pipefail +x
        shopt -s inherit_errexit
        
        sudo apt-get update
        sudo apt-get install qemu-user-static

    - name: Check out code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags so git describe works.

    - name: Configure promotions
      shell: bash
      if: ${{ contains(fromJSON('["push", "schedule"]'), github.event_name) }}
      run: |
        set -euEo pipefail +x
        shopt -s inherit_errexit
        
        echo "CI_PROMOTE=true" | tee -a ${GITHUB_ENV}
        
        echo '${{ secrets.QUAY_PASSWORD }}' | buildah login 'quay.io/tnozicka/images' -u='${{ secrets.QUAY_USER }}' --password-stdin

    - name: Build images
      shell: bash
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit
        
        if [[ "${{ env.CI_PROMOTE }}" == "true" ]]; then
          image_platform='${{ env.IMAGE_PLATFORM }}'
        else
          image_platform='linux/amd64'
        fi

        repo_ref='quay.io/tnozicka/images'
        git_revision="$( git rev-parse HEAD )"

        digestfile="$( mktemp )"
        skip_header=true
        while IFS=, read -r context_dir image_tag from_tag extra_args; do
          if "${skip_header}"; then
            skip_header=false
            continue;
          fi

          image_ref="${repo_ref}:${image_tag}"
          if [[ -z "${from_tag}" ]]; then
            from_ref=""
          else
            from_ref="${repo_ref}:${from_tag}-${{ github.run_number }}-${{ github.run_attempt }}"
          fi

          time buildah build --squash --format=docker \
          --platform="${image_platform}" \
          --label="org.opencontainers.image.revision=${git_revision}" \
          ${from_ref:+--from="${from_ref}"} \
          --manifest="${image_ref}-${{ github.run_number }}-${{ github.run_attempt }}" \
          ${extra_args:+${extra_args}} \
          "${context_dir}"

          if [[ "${{ env.CI_PROMOTE }}" == "true" ]]; then
            buildah push --digestfile="${digestfile}" "${image_ref}-${{ github.run_number }}-${{ github.run_attempt }}" "${image_ref}"
            echo '' | cat "${digestfile}" -
          fi
        done < image-spec.csv

  gating-tests:
    name: Wait for gating tests
    runs-on: ubuntu-24.04
    needs:
    - images
    if: ${{ always() }}
    steps:
    - name: Fail if any gating dependency failed
      if: ${{ contains(needs.*.result, 'failure') }}
      run: exit 1

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-24.04
    needs:
    - gating-tests
    timeout-minutes: 15
    if: ${{ failure() && github.event_name != 'pull_request' }}
    steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: Report failures to Slack
      if: ${{ always() }}
      uses: ./.github/actions/notify-failure
      with:
        slack-url: '${{ secrets.SLACK_WEBHOOK_URL }}'
